---
layout: default
---

<div class="post">
    <h2>{{ page.title }}</h2>
    <div class="date">{{ page.date | date: "%Y-%m-%d" }}</div>
    {% if page.tags.size > 0 %}
    <div class="tags">标签：{% for tag in page.tags %}<a href="{{ '/tags/' | relative_url }}{{ tag | url_encode }}/">{{ tag | escape }}</a>{% unless forloop.last %} {% endunless %}{% endfor %}</div>
    {% endif %}
    {{ content }}
</div>
